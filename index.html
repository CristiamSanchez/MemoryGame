<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Memory Game web responsive para jugar en PC y móvil."
    />
    <title>Memory Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mini proyecto</p>
          <h1>Memory Game</h1>
        </div>
        <button id="restartBtn" class="secondary-btn" type="button">Reiniciar</button>
      </header>

      <section class="players-panel" aria-label="Marcador de jugadores">
        <div class="player-card active" id="player1Panel">
          <div class="player-header">
            <span class="player-badge">P1</span>
            <strong>Player 1</strong>
          </div>
          <div class="player-stats">
            <span>Pares: <strong id="p1Pairs">0</strong></span>
            <span>Intentos: <strong id="p1Attempts">0</strong></span>
            <span>Tiempo: <strong id="p1Time">00:00</strong></span>
          </div>
        </div>

        <div class="versus">VS</div>

        <div class="player-card" id="player2Panel">
          <div class="player-header">
            <span class="player-badge alt">P2</span>
            <strong>Player 2</strong>
          </div>
          <div class="player-stats">
            <span>Pares: <strong id="p2Pairs">0</strong></span>
            <span>Intentos: <strong id="p2Attempts">0</strong></span>
            <span>Tiempo: <strong id="p2Time">00:00</strong></span>
          </div>
        </div>
      </section>

      <section class="status-panel" aria-label="Estado del juego">
        <div class="stat">
          <span class="label">Turno</span>
          <strong id="turnLabel">Player 1</strong>
        </div>
        <div class="stat">
          <span class="label">Pares</span>
          <strong id="pairs">0 / 8</strong>
        </div>
        <div class="stat timer-box">
          <span class="label">Tiempo</span>
          <strong id="timer">00:00</strong>
        </div>
      </section>

      <div class="control-row">
        <button id="passTurnBtn" class="pass-btn" type="button" hidden>
          Siguiente turno
        </button>
        <div class="games-counter">
          <span>Partidas</span>
          <strong id="gamesCounter">0</strong>
        </div>
      </div>

      <section class="board-wrap">
        <div id="board" class="board" aria-live="polite"></div>
      </section>

      <div id="message" class="message" aria-live="assertive">
        Encuentra todas las parejas.
      </div>
    </main>

    <div id="winnerModal" class="winner-modal" hidden>
      <div class="winner-card" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
        <p class="winner-label">Resultado final</p>
        <h2 id="winnerTitle">¡Ganador!</h2>
        <p id="winnerText">Player 1 ha ganado.</p>
        <button id="playAgainBtn" class="secondary-btn" type="button">Jugar otra vez</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
